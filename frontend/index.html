<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>옥션슈트 AI 데이터 비서</title>

  <link
    rel="stylesheet"
    href="styles.css"
  />
</head>

<body>

  <!-- ==================================================
       Header
  ================================================== -->

  <header>

    <div>
      <h1>옥션슈트 AI 데이터 비서</h1>

      <p>
        옥션슈트 통계 데이터를 기반으로 분석하고 답변합니다.
      </p>
    </div>

    <button
      id="theme-button"
      type="button"
    >
      다크 모드
    </button>

  </header>


  <!-- ==================================================
       Main
  ================================================== -->

  <main>

    <!-- ==================================================
         Sidebar
    ================================================== -->

    <aside class="sidebar">

      <div class="section-title">

        <h2>이전 대화</h2>

        <button
          id="new-chat-button"
          type="button"
        >
          새 대화
        </button>

      </div>

      <div id="conversation-list">
        대화 기록을 불러오는 중...
      </div>

    </aside>


    <!-- ==================================================
         Content
    ================================================== -->

    <section class="content">


      <!-- ==================================================
           데이터 요약
      ================================================== -->

      <section class="panel">

        <h2>데이터 요약</h2>

        <div
          id="summary"
          class="summary-grid"
        >
          데이터를 불러오는 중...
        </div>

      </section>


      <!-- ==================================================
           최근 30일 그래프
      ================================================== -->

      <section class="panel">

        <div class="section-title">

          <h2>최근 30일 추세</h2>

          <select id="chart-metric">

            <option value="pv">
              PV
            </option>

            <option value="users">
              사용자
            </option>

            <option value="gsc_clicks">
              GSC 클릭
            </option>

            <option value="gsc_impressions">
              GSC 노출
            </option>

            <option value="adsense_estimated">
              AdSense
            </option>

          </select>

        </div>

        <div class="chart-container">

          <canvas id="trend-chart"></canvas>

        </div>

      </section>


      <!-- ==================================================
           AI 채팅
      ================================================== -->

      <section class="panel chat-panel">

        <h2>AI 채팅</h2>

        <div
          id="chat-messages"
          class="chat-messages"
        >

          <div class="assistant-message">
            옥션슈트 데이터에 대해 질문해 주세요.
          </div>

        </div>


        <div
          id="loading"
          class="loading hidden"
        >
          AI가 데이터를 분석하고 있습니다...
        </div>


        <form
          id="chat-form"
          class="chat-form"
        >

          <input
            id="chat-input"
            type="text"
            placeholder="예: 최근 옥션슈트 성과는 어때?"
            autocomplete="off"
            required
          />

          <button type="submit">
            전송
          </button>

        </form>

      </section>


      <!-- ==================================================
           데이터 관리
      ================================================== -->

      <section class="panel">

        <div class="section-title">

          <h2>데이터 관리</h2>

          <button
            id="csv-button"
            type="button"
          >
            CSV 내보내기
          </button>

        </div>


        <!-- ==================================================
             데이터 입력/수정 폼
        ================================================== -->

        <form
          id="data-form"
          class="data-form"
        >

          <!-- 날짜 -->

          <div class="form-field">

            <label for="data-date">
              날짜
            </label>

            <input
              id="data-date"
              type="date"
              required
            />

          </div>


          <!-- 게시물 -->

          <div class="form-field">

            <label for="data-posts">
              게시물 수
            </label>

            <input
              id="data-posts"
              type="number"
              min="0"
              step="1"
              placeholder="게시물"
            />

          </div>


          <!-- 페이지 -->

          <div class="form-field">

            <label for="data-pages">
              페이지 수
            </label>

            <input
              id="data-pages"
              type="number"
              min="0"
              step="1"
              placeholder="페이지"
            />

          </div>


          <!-- 사용자 -->

          <div class="form-field">

            <label for="data-users">
              사용자 수
            </label>

            <input
              id="data-users"
              type="number"
              min="0"
              step="1"
              placeholder="사용자"
            />

          </div>


          <!-- PV -->

          <div class="form-field">

            <label for="data-pv">
              PV
            </label>

            <input
              id="data-pv"
              type="number"
              min="0"
              step="1"
              placeholder="PV"
              required
            />

          </div>


          <!-- AdSense -->

          <div class="form-field">

            <label for="data-adsense">
              AdSense 예상수익
            </label>

            <input
              id="data-adsense"
              type="number"
              min="0"
              step="0.01"
              placeholder="예: 0.15"
            />

          </div>


          <!-- GSC 클릭 -->

          <div class="form-field">

            <label for="data-gsc-clicks">
              GSC 클릭
            </label>

            <input
              id="data-gsc-clicks"
              type="number"
              min="0"
              step="1"
              placeholder="클릭"
            />

          </div>


          <!-- GSC 노출 -->

          <div class="form-field">

            <label for="data-gsc-impressions">
              GSC 노출
            </label>

            <input
              id="data-gsc-impressions"
              type="number"
              min="0"
              step="1"
              placeholder="노출"
            />

          </div>


          <!-- GSC CTR -->

          <div class="form-field">

            <label for="data-gsc-ctr">
              GSC CTR (%)
            </label>

            <input
              id="data-gsc-ctr"
              type="number"
              min="0"
              max="100"
              step="0.01"
              placeholder="예: 1.64"
            />

          </div>


          <!-- GSC 평균순위 -->

          <div class="form-field">

            <label for="data-gsc-position">
              GSC 평균순위
            </label>

            <input
              id="data-gsc-position"
              type="number"
              min="0"
              step="0.01"
              placeholder="예: 7.36"
            />

          </div>


          <!-- 메모 -->

          <div class="form-field form-field-wide">

            <label for="data-memo">
              메모
            </label>

            <input
              id="data-memo"
              type="text"
              placeholder="메모"
            />

          </div>


          <!-- 버튼 -->

          <div class="form-actions">

            <button
              id="data-submit-button"
              type="submit"
            >
              추가
            </button>

            <button
              id="edit-cancel-button"
              class="hidden"
              type="button"
            >
              수정 취소
            </button>

          </div>

        </form>


        <div
          id="edit-status"
          class="loading hidden"
        >
        </div>


        <!-- ==================================================
             데이터 표
        ================================================== -->

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>
                <th>날짜</th>
                <th>게시물</th>
                <th>페이지</th>
                <th>사용자</th>
                <th>PV</th>
                <th>AdSense</th>
                <th>클릭</th>
                <th>노출</th>
                <th>CTR</th>
                <th>검색순위</th>
                <th>메모</th>
                <th>관리</th>
              </tr>

            </thead>

            <tbody id="data-table-body">
            </tbody>

          </table>

        </div>

      </section>

    </section>

  </main>


  <!-- ==================================================
       Libraries
  ================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js"
  ></script>


  <!-- ==================================================
       Application
  ================================================== -->

  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
