<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>옥션슈트 AI 데이터 비서</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header>
    <div>
      <h1>옥션슈트 AI 데이터 비서</h1>
      <p>
        옥션슈트 통계 데이터를 기반으로 분석하고 답변합니다.
      </p>
    </div>

    <button id="theme-button" type="button">
      다크 모드
    </button>
  </header>


  <main>

    <!-- 왼쪽: 이전 대화 -->
    <aside class="sidebar">

      <div class="section-title">
        <h2>이전 대화</h2>

        <button
          id="new-chat-button"
          type="button"
        >
          새 대화
        </button>
      </div>

      <div id="conversation-list">
        대화 기록을 불러오는 중...
      </div>

    </aside>


    <!-- 오른쪽 콘텐츠 -->
    <section class="content">

      <!-- 데이터 요약 -->
      <section class="panel">

        <h2>데이터 요약</h2>

        <div
          id="summary"
          class="summary-grid"
        >
          데이터를 불러오는 중...
        </div>

      </section>


      <!-- 최근 추세 그래프 -->
      <section class="panel">

        <div class="section-title">

          <h2>최근 30일 추세</h2>

          <select id="chart-metric">
            <option value="pv">PV</option>
            <option value="users">사용자</option>
            <option value="gsc_clicks">
              GSC 클릭
            </option>
            <option value="gsc_impressions">
              GSC 노출
            </option>
          </select>

        </div>

        <div class="chart-container">
          <canvas id="trend-chart"></canvas>
        </div>

      </section>


      <!-- AI 채팅 -->
      <section class="panel chat-panel">

        <h2>AI 채팅</h2>

        <div
          id="chat-messages"
          class="chat-messages"
        >

          <div class="assistant-message">
            옥션슈트 데이터에 대해 질문해 주세요.
          </div>

        </div>

        <div
          id="loading"
          class="loading hidden"
        >
          AI가 데이터를 분석하고 있습니다...
        </div>

        <form
          id="chat-form"
          class="chat-form"
        >

          <input
            id="chat-input"
            type="text"
            placeholder="예: 최근 옥션슈트 성과는 어때?"
            autocomplete="off"
            required
          />

          <button type="submit">
            전송
          </button>

        </form>

      </section>


      <!-- 데이터 관리 -->
      <section class="panel">

        <div class="section-title">

          <h2>데이터 관리</h2>

          <button
            id="csv-button"
            type="button"
          >
            CSV 내보내기
          </button>

        </div>


        <form
          id="data-form"
          class="data-form"
        >

          <input
            id="data-date"
            type="date"
            required
          />

          <input
            id="data-value"
            type="number"
            placeholder="PV"
            required
          />

          <input
            id="data-memo"
            type="text"
            placeholder="메모"
          />

          <button type="submit">
            추가
          </button>

        </form>


        <div class="table-wrapper">

          <table>

            <thead>
              <tr>
                <th>날짜</th>
                <th>PV</th>
                <th>사용자</th>
                <th>클릭</th>
                <th>노출</th>
                <th>CTR</th>
                <th>검색순위</th>
                <th>관리</th>
              </tr>
            </thead>

            <tbody id="data-table-body">
            </tbody>

          </table>

        </div>

      </section>

    </section>

  </main>


  <!-- Markdown 렌더링 -->
  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>

  <!-- Markdown HTML 보안 처리 -->
  <script
    src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"
  ></script>

  <!-- 그래프 -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js"
  ></script>

  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
